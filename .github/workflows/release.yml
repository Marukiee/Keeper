name: Release

# Push a tag like v0.1.0 and this builds, signs and publishes the APK.
# Run by hand from the Actions tab to try the build without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to build, for example v0.1.0 (ignored when run from a tag)
        type: string
      publish:
        description: Create the GitHub Release, not only build the file
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      publish: ${{ steps.v.outputs.publish }}
    env:
      # Public fingerprint of the release key (see CLAUDE.md). Publishing an APK
      # signed by anything else would strand every installed copy.
      EXPECTED_SHA256: 6de9cbecc75e29fdc1db75c0c882ebe6a578480443e45fe430ee4884e0a180c0
    steps:
      - id: v
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = tag ]; then tag="$REF_NAME"; else tag="$INPUT_TAG"; fi
          re='^v([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$'
          [[ "$tag" =~ $re ]] || { echo "::error::'$tag' is not a version tag like v1.2.3"; exit 1; }
          major=$((10#${BASH_REMATCH[1]})); minor=$((10#${BASH_REMATCH[2]})); patch=$((10#${BASH_REMATCH[3]}))
          # Android needs a versionCode that only ever goes up. Two digits each for
          # minor and patch keeps that true, so anything above 99 would break it.
          if [ "$minor" -gt 99 ] || [ "$patch" -gt 99 ]; then
            echo "::error::minor and patch must stay below 100 for the versionCode scheme"; exit 1
          fi
          publish=false
          if [ "$REF_TYPE" = tag ] || [ "$INPUT_PUBLISH" = true ]; then publish=true; fi
          {
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "code=$((major * 10000 + minor * 100 + patch))"
            echo "prerelease=$([[ "$tag" == *-* ]] && echo true || echo false)"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: |
          sdkmanager --sdk_root="$ANDROID_HOME" --install "platforms;android-36" "build-tools;36.0.0" >/dev/null

      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/libs.versions.toml', 'android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Write the keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$KEYSTORE_B64" ] || { echo "::error::ANDROID_KEYSTORE_B64 is not set"; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/keystore.jks
          # storeFile is relative to the android folder, see app/build.gradle.kts.
          {
            echo "storeFile=keystore.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/keystore.properties

      - name: Build the signed APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PversionName="${{ steps.v.outputs.version }}" -PversionCode="${{ steps.v.outputs.code }}"

      # Gradle falls back to the debug key when the keystore is missing, and the
      # build still succeeds. This makes that a failure instead of a bad release.
      - name: Check the signing key
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" | tee certs.txt
          grep -q "SHA-256 digest: $EXPECTED_SHA256" certs.txt \
            || { echo "::error::the APK is not signed with the Keeper release key"; exit 1; }

      - name: Name the files
        run: |
          set -euo pipefail
          mkdir dist
          apk=android/app/build/outputs/apk/release/app-release.apk
          cp "$apk" "dist/Keeper-v${{ steps.v.outputs.version }}.apk"
          cp "$apk" dist/Keeper.apk
          (cd dist && sha256sum Keeper.apk > Keeper.apk.sha256)

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist/*
          if-no-files-found: error

  publish:
    name: GitHub Release
    needs: android
    if: ${{ needs.android.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: android
          path: dist

      # The app shows this text under the update. It is .github/release-notes/<tag>.md when that file exists, else the commit subjects since the previous tag.
      - name: Release notes
        env:
          TAG: ${{ needs.android.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -f ".github/release-notes/$TAG.md" ]; then
            # Written by hand for this release (English first, the app shows that part).
            cp ".github/release-notes/$TAG.md" notes.md
          else
            prev=$(git tag --list 'v*' --sort=-v:refname | grep -vx "$TAG" | head -n 1 || true)
            git log --no-merges --pretty='- %s' ${prev:+"$prev..HEAD"} > notes.md
          fi
          cat notes.md

      # The app looks for these names in releases/latest: Keeper.apk and Keeper.apk.sha256.
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.android.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          make_latest: ${{ needs.android.outputs.prerelease != 'true' }}
          prerelease: ${{ needs.android.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: dist/*
